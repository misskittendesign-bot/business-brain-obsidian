<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3fa4"/>
      <stop offset="1" stop-color="#e0127a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="520" fill="#0e0e13"/>
  <rect width="1280" height="520" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="112" fill="#ff2d95" font-size="17" font-weight="700" letter-spacing="4">OBSIDIAN-VORLAGE FÜRS ONLINE-BUSINESS</text>
    <text x="60" y="222" fill="#ffffff" font-family="'Bebas Neue', Impact, 'Arial Narrow', 'Arial Black', sans-serif" font-size="118" font-weight="700" letter-spacing="1">BUSINESS</text>
