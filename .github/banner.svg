    <rect x="700" y="48" width="516" height="424" fill="#16161d" stroke="#2a2a35"/>
    <g transform="translate(728,84)">
      <rect x="0" y="-18" width="34" height="24" fill="url(#pink)"/><text x="7" y="0" fill="#fff" font-weight="700">00</text><text x="50" y="0">Inbox</text>
      <rect x="0" y="12" width="34" height="24" fill="url(#pink)"/><text x="7" y="30" fill="#fff" font-weight="700">01</text><text x="50" y="30">Marke &amp; Ich</text>
      <rect x="0" y="42" width="34" height="24" fill="url(#pink)"/><text x="7" y="60" fill="#fff" font-weight="700">02</text><text x="50" y="60">Zielgruppe</text>
      <rect x="0" y="72" width="34" height="24" fill="url(#pink)"/><text x="7" y="90" fill="#fff" font-weight="700">03</text><text x="50" y="90">Angebote &amp; Produkte</text>
      <rect x="0" y="102" width="34" height="24" fill="url(#pink)"/><text x="7" y="120" fill="#fff" font-weight="700">04</text><text x="50" y="120">Onlinekurse</text>
      <rect x="0" y="132" width="34" height="24" fill="url(#pink)"/><text x="7" y="150" fill="#fff" font-weight="700">05</text><text x="50" y="150">Content &amp; Kanäle</text>
      <rect x="0" y="162" width="34" height="24" fill="url(#pink)"/><text x="7" y="180" fill="#fff" font-weight="700">06</text><text x="50" y="180">Community</text>
      <rect x="0" y="192" width="34" height="24" fill="url(#pink)"/><text x="7" y="210" fill="#fff" font-weight="700">07</text><text x="50" y="210">Funnel &amp; E-Mails</text>
      <rect x="0" y="222" width="34" height="24" fill="url(#pink)"/><text x="7" y="240" fill="#fff" font-weight="700">08</text><text x="50" y="240">Zahlen &amp; Ziele</text>
      <rect x="0" y="252" width="34" height="24" fill="url(#pink)"/><text x="7" y="270" fill="#fff" font-weight="700">09</text><text x="50" y="270">Projekte</text>
      <rect x="0" y="282" width="34" height="24" fill="url(#pink)"/><text x="7" y="300" fill="#fff" font-weight="700">10</text><text x="50" y="300">Prozesse &amp; Vorlagen</text>
      <rect x="0" y="312" width="34" height="24" fill="url(#pink)"/><text x="7" y="330" fill="#fff" font-weight="700">11</text><text x="50" y="330">Tools &amp; Technik</text>
      <rect x="0" y="342" width="34" height="24" fill="url(#pink)"/><text x="7" y="360" fill="#fff" font-weight="700">12</text><text x="50" y="360">Archiv</text>
