    <text x="64" y="388" fill="#c9c9d2" font-size="22">Dein zweites Gehirn für Marke, Zielgruppe,</text>
    <text x="64" y="420" fill="#c9c9d2" font-size="22">Produkte, Content, Funnels und Zahlen.</text>
    <text x="64" y="468" fill="#8a8a96" font-size="16">Herunterladen, entpacken, in Obsidian öffnen. Fertig für Claude Code.</text>
  </g>

